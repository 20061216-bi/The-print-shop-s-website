<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单文件上传</title>
    <link rel="stylesheet" href="upload.css">
</head>
<body>

    <div class="container" id="app">
        <div class="header">
            <span class="logo">📋</span>
            <h1>订单文件上传</h1>
            <p>填写信息并上传文件</p>
        </div>

        <div class="guide-box">
            <div class="title">📱 如何上传文件</div>
            <div class="step">
                1. 点击「选择文件」<br>
                2. 选择「拍照」/「相册」/「文件管理」<br>
                3. 从手机存储中选取文件
            </div>
        </div>

        <div id="formSection">
            <div class="form-group">
                <label>💬 微信号 <span class="required">*</span></label>
                <input type="text" id="wechatId" placeholder="请输入您的微信号" />
                <div class="hint">文件将保存到以您微信号命名的文件夹中</div>
            </div>
            <div class="form-group">
                <label>📝 备注</label>
                <textarea id="remark" placeholder="如需补充说明，请在此填写…"></textarea>
            </div>

            <div class="upload-zone" id="uploadZone">
                <span class="icon">📎</span>
                <span class="main-text">点击选择文件</span>
                <span class="sub-text">📷 拍照 · 🖼️ 相册 · 📁 文件</span>
                <div class="file-types">
                    <span>📄 Word</span>
                    <span>📊 Excel</span>
                    <span>📽️ PPT</span>
                    <span>🖼️ 图片</span>
                    <span>📕 PDF</span>
                </div>
                <input type="file" id="fileInput" multiple accept=".doc,.docx,.ppt,.pptx,.xls,.xlsx,.pdf,.jpg,.jpeg,.png,.gif,.bmp,.svg,.webp" />
            </div>

            <div class="file-list" id="fileList"></div>

            <button class="btn-submit" id="submitBtn">
                <span class="spinner"></span>
                <span class="btn-text">🚀 提交订单</span>
            </button>
        </div>

        <div class="success-screen" id="successScreen">
            <span class="check">✅</span>
            <h2>上传成功！</h2>
            <p>您的文件已提交，我们会尽快处理</p>
            <button class="btn-new" id="newUploadBtn">📤 继续上传</button>
        </div>

        <div class="admin-link">
            <a href="/admin" target="_blank">📊 管理后台</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="upload.js"></script>
</body>
</html>
