<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单文件上传</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #f0f4f9;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 36px 28px 32px;
            box-shadow: 0 16px 48px rgba(26, 47, 80, 0.10);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header .logo { font-size: 44px; display: block; margin-bottom: 4px; }
        .header h1 { font-size: 22px; font-weight: 700; color: #0b1b32; }
        .header p { color: #6b7f99; font-size: 14px; margin-top: 2px; }

        .guide-box {
            background: #e8f0fe;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #1f3a5f;
            border: 1px solid #c5d5ea;
        }
        .guide-box .title { font-weight: 600; margin-bottom: 4px; }
        .guide-box .step { padding-left: 6px; line-height: 1.8; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #1f3a5f; margin-bottom: 5px; }
        .form-group label .required { color: #e74c3c; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 13px 16px; background: #f5f8fe;
            border: 2px solid #e8edf5; border-radius: 12px; font-size: 15px;
            color: #0b1b32; outline: none; font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #1f3a5f; box-shadow: 0 0 0 4px rgba(31, 58, 95, 0.07);
            background: #ffffff;
        }
        .form-group .hint { font-size: 12px; color: #9aabc0; margin-top: 4px; }
        .form-group textarea { resize: vertical; min-height: 64px; max-height: 130px; }

        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            background: #fafcff;
            transition: border-color 0.25s, background 0.25s;
            position: relative;
            margin-bottom: 14px;
        }
        .upload-zone:hover { border-color: #1f3a5f; }
        .upload-zone.dragover { border-color: #1f3a5f; background: #eef4fe; }
        .upload-zone .icon { font-size: 36px; display: block; margin-bottom: 4px; }
        .upload-zone .main-text { font-size: 15px; font-weight: 500; color: #1f3a5f; }
        .upload-zone .sub-text { font-size: 13px; color: #8a9db2; display: block; margin-top: 2px; }
        .upload-zone input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer;
            width: 100%; height: 100%;
        }
        .upload-zone .file-types { margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }
        .upload-zone .file-types span { background: #eef2f9; padding: 2px 14px; border-radius: 30px; font-size: 11px; color: #1f3a5f; font-weight: 500; }

        .file-list { margin-bottom: 18px; max-height: 200px; overflow-y: auto; }
        .file-item {
            display: flex; align-items: center; gap: 10px; padding: 9px 14px;
            background: #f5f8fe; border-radius: 10px; margin-bottom: 6px;
            animation: fadeIn 0.2s ease;
        }
        .file-item .file-icon { font-size: 26px; flex-shrink: 0; }
        .file-item .file-info { flex: 1; min-width: 0; }
        .file-item .file-name { font-size: 14px; color: #0b1b32; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-item .file-size { font-size: 12px; color: #8a9db2; }
        .file-item .file-remove {
            background: none; border: none; color: #b0c4d9; font-size: 20px;
            cursor: pointer; padding: 0 4px; flex-shrink: 0;
            transition: color 0.15s;
        }
        .file-item .file-remove:hover { color: #e74c3c; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

        .btn-submit {
            width: 100%; padding: 15px 0; background: #1f3a5f; color: #ffffff;
            border: none; border-radius: 60px; font-size: 17px; font-weight: 600;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
            box-shadow: 0 6px 20px rgba(31, 58, 95, 0.22);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:active { transform: scale(0.97); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-submit .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .btn-submit.loading .spinner { display: inline-block; }
        .btn-submit.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(80px); background: #1f2a3f;
            color: #fff; padding: 11px 28px; border-radius: 60px; font-size: 14px;
            font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
            pointer-events: none; max-width: 90%; text-align: center; z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: #1a6b3c; }
        .toast.error { background: #b13e3e; }

        .success-screen { display: none; text-align: center; padding: 24px 0 8px; }
        .success-screen .check { font-size: 60px; display: block; margin-bottom: 8px; }
        .success-screen h2 { font-size: 21px; color: #0b1b32; margin-bottom: 4px; }
        .success-screen p { color: #6b7f99; font-size: 14px; }
        .success-screen .btn-new { margin-top: 20px; background: #eef2f9; color: #1f3a5f; border: none; padding: 11px 34px; border-radius: 40px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .success-screen .btn-new:active { background: #dce5f2; }

        .admin-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #9aabc0;
        }
        .admin-link a { color: #6b7f99; text-decoration: none; }
        .admin-link a:hover { color: #1f3a5f; }

        @media (max-width: 420px) {
            .container { padding: 24px 16px; }
            .header h1 { font-size: 19px; }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div class="header">
            <span class="logo">📋</span>
            <h1>订单文件上传</h1>
            <p>填写信息并上传文件</p>
        </div>

        <div class="guide-box">
            <div class="title">📱 如何上传文件</div>
            <div class="step">
                1. 点击「选择文件」<br>
                2. 选择「拍照」/「相册」/「文件管理」<br>
                3. 从手机存储中选取文件
            </div>
        </div>

        <div id="formSection">
            <div class="form-group">
                <label>💬 微信号 <span class="required">*</span></label>
                <input type="text" id="wechatId" placeholder="请输入您的微信号" />
                <div class="hint">文件将保存到以您微信号命名的文件夹中</div>
            </div>
            <div class="form-group">
                <label>📝 备注</label>
                <textarea id="remark" placeholder="如需补充说明，请在此填写…"></textarea>
            </div>

            <div class="upload-zone" id="uploadZone">
                <span class="icon">📎</span>
                <span class="main-text">点击选择文件</span>
                <span class="sub-text">📷 拍照 · 🖼️ 相册 · 📁 文件</span>
                <div class="file-types">
                    <span>📄 Word</span>
                    <span>📊 Excel</span>
                    <span>📽️ PPT</span>
                    <span>🖼️ 图片</span>
                    <span>📕 PDF</span>
                </div>
                <input type="file" id="fileInput" multiple accept=".doc,.docx,.ppt,.pptx,.xls,.xlsx,.pdf,.jpg,.jpeg,.png,.gif,.bmp,.svg,.webp" />
            </div>

            <div class="file-list" id="fileList"></div>

            <button class="btn-submit" id="submitBtn">
                <span class="spinner"></span>
                <span class="btn-text">🚀 提交订单</span>
            </button>
        </div>

        <div class="success-screen" id="successScreen">
            <span class="check">✅</span>
            <h2>上传成功！</h2>
            <p>您的文件已提交，我们会尽快处理</p>
            <button class="btn-new" id="newUploadBtn">📤 继续上传</button>
        </div>

        <div class="admin-link">
            <a href="/admin" target="_blank">📊 管理后台</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var formSection = document.getElementById('formSection');
        var successScreen = document.getElementById('successScreen');
        var wechatId = document.getElementById('wechatId');
        var remark = document.getElementById('remark');
        var fileInput = document.getElementById('fileInput');
        var uploadZone = document.getElementById('uploadZone');
        var fileList = document.getElementById('fileList');
        var submitBtn = document.getElementById('submitBtn');
        var newUploadBtn = document.getElementById('newUploadBtn');
        var toastEl = document.getElementById('toast');

        var selectedFiles = [];
        var isSubmitting = false;
        var toastTimer = null;

        function showToast(msg, type, duration) {
            type = type || 'info';
            duration = duration || 2500;
            toastEl.textContent = msg;
            toastEl.className = 'toast ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toastEl.classList.remove('show');
            }, duration);
            requestAnimationFrame(function() {
                toastEl.classList.add('show');
            });
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
        }

        function getFileIcon(name) {
            var ext = name.split('.').pop().toLowerCase();
            var map = { 'doc': '📄', 'docx': '📄', 'ppt': '📽️', 'pptx': '📽️', 'xls': '📊', 'xlsx': '📊', 'pdf': '📕' };
            return map[ext] || '📎';
        }

        function renderFileList() {
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '';
                return;
            }
            var html = '';
            selectedFiles.forEach(function(file, i) {
                html += `
                    <div class="file-item">
                        <span class="file-icon">${getFileIcon(file.name)}</span>
                        <div class="file-info">
                            <span class="file-name">${file.name}</span>
                            <span class="file-size">${formatSize(file.size)}</span>
                        </div>
                        <button class="file-remove" data-index="${i}">✕</button>
                    </div>
                `;
            });
            fileList.innerHTML = html;
            document.querySelectorAll('.file-remove').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx)) {
                        selectedFiles.splice(idx, 1);
                        renderFileList();
                        fileInput.value = '';
                    }
                });
            });
        }

        function handleFiles(files) {
            if (!files || files.length === 0) return;
            var allowed = ['doc','docx','ppt','pptx','xls','xlsx','pdf','jpg','jpeg','png','gif','bmp','svg','webp'];
            var valid = [];
            for (var i = 0; i < files.length; i++) {
                var f = files[i];
                var ext = f.name.split('.').pop().toLowerCase();
                if (allowed.indexOf(ext) !== -1 || f.type.startsWith('image/')) {
                    valid.push(f);
                } else {
                    showToast('⚠️ 跳过: ' + f.name, 'error', 1800);
                }
            }
            if (valid.length === 0) return;
            selectedFiles = selectedFiles.concat(valid);
            renderFileList();
            showToast('📎 已选 ' + valid.length + ' 个文件', 'success', 1200);
            fileInput.value = '';
        }

        async function submitOrder() {
            var wechat = wechatId.value.trim();
            if (!wechat) {
                showToast('⚠️ 请输入微信号', 'error', 1600);
                wechatId.focus();
                return;
            }
            if (selectedFiles.length === 0) {
                showToast('⚠️ 请至少选择一个文件', 'error', 1600);
                return;
            }
            if (isSubmitting) return;

            isSubmitting = true;
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                var formData = new FormData();
                formData.append('wechat', wechat);
                formData.append('remark', remark.value.trim() || '');
                for (var i = 0; i < selectedFiles.length; i++) {
                    formData.append('files', selectedFiles[i]);
                }

                var resp = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                var result = await resp.json();
                if (result.code === 200) {
                    showToast('✅ 订单提交成功！', 'success', 2500);
                    formSection.style.display = 'none';
                    successScreen.style.display = 'block';
                    selectedFiles = [];
                    renderFileList();
                    remark.value = '';
                    fileInput.value = '';
                } else {
                    throw new Error(result.message || '上传失败');
                }
            } catch (err) {
                console.error('上传错误:', err);
                showToast('❌ ' + err.message, 'error', 4000);
            } finally {
                isSubmitting = false;
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        }

        fileInput.addEventListener('change', function(e) { handleFiles(e.target.files); });

        uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', function(e) { e.preventDefault(); uploadZone.classList.remove('dragover'); });
        uploadZone.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
        });
        uploadZone.addEventListener('click', function(e) { if (e.target.tagName !== 'INPUT') fileInput.click(); });

        submitBtn.addEventListener('click', submitOrder);
        newUploadBtn.addEventListener('click', function() {
            successScreen.style.display = 'none';
            formSection.style.display = 'block';
        });

        console.log('📋 订单上传已启动');
    </script>

</body>
</html>
