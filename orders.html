<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我的历史订单</title>
    <link rel="stylesheet" href="./css/order.css">
</head>
<body>

<div class="app-container">
    <div class="brand-header">
        <div class="brand-title">
            <span class="brand-name">📦 我的订单</span>
            <span class="brand-badge">历史记录</span>
        </div>
        <a href="" class="back-link">← 返回</a>
    </div>

    <div class="user-info" id="userInfo">
        <div class="avatar" id="userAvatar">👤</div>
        <span class="name" id="userName">用户</span>
    </div>

    <div class="stats-row" id="statsRow" style="display:none;">
        <div class="stat-item">
            <div class="num" id="totalOrders">0</div>
            <div class="label">总订单</div>
        </div>
        <div class="stat-item">
            <div class="num" id="totalFiles">0</div>
            <div class="label">总文件</div>
        </div>
        <div class="stat-item">
            <div class="num" id="pendingCount">0</div>
            <div class="label">待处理</div>
        </div>
    </div>

    <div id="orderList">
        <div class="loading"><div class="spinner"></div><p style="margin-top:10px;">加载中...</p></div>
    </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
    <a href="/">
        <div class="nav-item">
            <span class="icon">🏠</span>
            <span>首页</span>
        </div>
    </a>
    <a href="/upload">
        <div class="nav-item">
            <span class="icon">📤</span>
            <span>上传</span>
        </div>
    </a>
    <a href="/orders">
        <div class="nav-item active">
            <span class="icon">📚</span>
            <span>订单</span>
        </div>
    </a>
    <div class="nav-item">
        <span class="icon">👤</span>
        <span>我的</span>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="./js/order.js"></script>
</body>
</html>
