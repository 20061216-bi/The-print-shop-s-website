<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理后台</title>
    <!-- 引入CSS -->
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

<div id="app">
    <!-- 登录/设置密码界面 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2 id="loginTitle">🔐 管理后台</h2>
            <p id="loginDesc">请输入密码进入后台</p>
            <div class="sub" id="loginSub">首次使用请设置密码</div>
            <div class="error" id="loginError">密码错误，请重试</div>
            <input type="password" id="passwordInput" placeholder="请输入密码" />
            <input type="password" id="confirmInput" placeholder="请再次输入密码" style="display:none;" />
            <button class="btn-login" id="loginBtn">登录</button>
            <div class="hint" id="loginHint">提示：首次访问请设置密码，之后用该密码登录</div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainContent" style="display:none;">
        <div class="container">
            <div class="header">
                <h1>📦 订单管理 <small id="orderCount">0 个订单</small></h1>
                <div class="header-actions">
                    <button class="btn btn-outline" id="refreshBtn">🔄 刷新</button>
                    <button class="btn btn-outline" id="logoutBtn">🚪 退出</button>
                    <a href="/" class="btn btn-primary">📤 上传页面</a>
                </div>
            </div>

            <!-- 搜索栏 -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 搜索微信号 / 订单编号 / 备注..." />
                <button class="btn btn-info" id="searchBtn">搜索</button>
                <button class="btn btn-outline" id="clearBtn">清空</button>
            </div>

            <!-- 统计 -->
            <div class="stats" id="stats">
                <div class="stat-card"><div class="num" id="totalOrders">0</div><div class="label">📋 总订单</div></div>
                <div class="stat-card"><div class="num" id="totalFiles">0</div><div class="label">📄 总文件</div></div>
                <div class="stat-card"><div class="num" id="totalSize">0</div><div class="label">📦 总大小</div></div>
                <div class="stat-card"><div class="num" id="pendingOrders">0</div><div class="label">⏳ 待处理</div></div>
            </div>

            <div id="orderList">
                <div class="loading"><div class="spinner"></div><p style="margin-top:12px;">加载中...</p></div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- 引入JS -->
<script src="./js/admin.js"></script>
</body>
</html>
