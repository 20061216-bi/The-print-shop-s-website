<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f4f9;
            padding: 24px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
            background: #fff; padding: 16px 24px; border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .header h1 { font-size: 22px; color: #0b1b32; display: flex; align-items: center; gap: 10px; }
        .header h1 small { font-size: 14px; font-weight: 400; color: #6b7f99; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .btn {
            padding: 8px 20px; border: none; border-radius: 40px; font-size: 13px;
            font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .btn-primary { background: #1f3a5f; color: #fff; }
        .btn-primary:hover { background: #142b47; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-success:hover { background: #1e8449; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-outline { background: transparent; color: #1f3a5f; border: 2px solid #d0dbea; }
        .btn-outline:hover { background: #eef2f9; }
        .btn-sm { padding: 4px 14px; font-size: 12px; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-warning:hover { background: #d68910; }
        .btn-info { background: #3498db; color: #fff; }
        .btn-info:hover { background: #2c81ba; }

        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px; margin-bottom: 24px;
        }
        .stat-card {
            background: #fff; padding: 18px 22px; border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .stat-card .num { font-size: 28px; font-weight: 700; color: #1f3a5f; }
        .stat-card .label { font-size: 13px; color: #6b7f99; margin-top: 2px; }

        .order-grid { display: grid; gap: 14px; }
        .order-card {
            background: #ffffff; border-radius: 16px; padding: 18px 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px;
        }
        .order-card .border-status {
            width: 4px; border-radius: 4px; flex-shrink: 0; height: 60px;
        }
        .order-card .border-status.pending { background: #f39c12; }
        .order-card .border-status.processing { background: #3498db; }
        .order-card .border-status.completed { background: #27ae60; }
        .order-card .border-status.cancelled { background: #e74c3c; }
        .order-card .info { flex: 1; min-width: 200px; }
        .order-card .order-id { font-size: 14px; font-weight: 600; color: #0b1b32; }
        .order-card .order-id .tag { font-size: 12px; font-weight: 400; }
        .order-card .wechat { font-size: 16px; font-weight: 600; color: #0b1b32; margin-top: 2px; }
        .order-card .wechat .icon { margin-right: 6px; }
        .order-card .meta { font-size: 13px; color: #6b7f99; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
        .order-card .meta span { background: #f5f8fe; padding: 0 12px; border-radius: 30px; }
        .order-card .files-list {
            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;
        }
        .order-card .file-tag {
            background: #eef2f9; padding: 3px 12px; border-radius: 30px;
            font-size: 13px; display: inline-flex; align-items: center; gap: 4px;
            color: #1f3a5f;
        }
        .order-card .file-tag a {
            color: #1f3a5f;
            text-decoration: none;
            font-weight: 500;
        }
        .order-card .file-tag a:hover {
            text-decoration: underline;
            color: #0b1b32;
        }
        .order-card .remark-content {
            background: #f0f5fe; padding: 6px 14px; border-radius: 10px;
            font-size: 13px; color: #1e385a; margin-top: 6px;
            border-left: 3px solid #2a4b7a;
            white-space: pre-wrap;
            max-height: 100px;
            overflow-y: auto;
        }
        .order-card .status-badge {
            padding: 2px 14px; border-radius: 30px; font-size: 12px; font-weight: 500;
            display: inline-block;
        }
        .order-card .status-badge.pending { background: #fef9e7; color: #b7950b; }
        .order-card .status-badge.processing { background: #d4e6f1; color: #1a5276; }
        .order-card .status-badge.completed { background: #d5f5e3; color: #1a6b3c; }
        .order-card .status-badge.cancelled { background: #fadbd8; color: #922b21; }
        .order-card .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .empty { text-align: center; padding: 60px 0; color: #9aabc0; }
        .empty .icon { font-size: 48px; display: block; margin-bottom: 10px; }
        .loading { text-align: center; padding: 40px; color: #6b7f99; }
        .loading .spinner {
            display: inline-block; width: 32px; height: 32px;
            border: 4px solid #e8edf5; border-top-color: #1f3a5f;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: #1f2a3f; color: #fff; padding: 12px 28px; border-radius: 60px;
            font-size: 14px; font-weight: 500; box-shadow: 0 8px 28px rgba(0,0,0,0.15);
            opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: #1a6b3c; }
        .toast.error { background: #b13e3e; }

        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .login-box {
            background: #fff; padding: 40px 36px; border-radius: 24px;
            max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .login-box h2 { font-size: 22px; color: #0b1b32; margin-bottom: 8px; }
        .login-box p { color: #6b7f99; font-size: 14px; margin-bottom: 4px; }
        .login-box .sub { color: #9aabc0; font-size: 13px; margin-bottom: 20px; }
        .login-box input {
            width: 100%; padding: 13px 16px; border: 2px solid #e8edf5;
            border-radius: 12px; font-size: 15px; outline: none;
            transition: border-color 0.2s; margin-bottom: 12px;
        }
        .login-box input:focus { border-color: #1f3a5f; }
        .login-box .btn-login {
            width: 100%; padding: 14px; background: #1f3a5f; color: #fff;
            border: none; border-radius: 60px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        .login-box .btn-login:hover { background: #142b47; }
        .login-box .error { color: #e74c3c; font-size: 13px; margin-bottom: 12px; display: none; }
        .login-box .hint { font-size: 12px; color: #9aabc0; margin-top: 12px; text-align: center; }

        .search-bar {
            display: flex; gap: 10px; align-items: center;
            background: #fff; padding: 12px 20px; border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1; padding: 8px 14px; border: 2px solid #e8edf5;
            border-radius: 40px; font-size: 14px; outline: none;
            transition: border-color 0.2s; min-width: 150px;
        }
        .search-bar input:focus { border-color: #1f3a5f; }

        .download-all {
            background: #fff; padding: 12px 20px; border-radius: 16px;
            margin-bottom: 16px; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .download-all .btn {
            padding: 8px 30px;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .header { padding: 12px 16px; flex-direction: column; align-items: stretch; }
            .header h1 { font-size: 18px; }
            .order-card { padding: 14px 16px; flex-direction: column; align-items: stretch; }
            .order-card .actions { justify-content: flex-start; }
            .login-box { padding: 28px 20px; margin: 16px; }
            .search-bar { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 登录/设置密码界面 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2 id="loginTitle">🔐 管理后台</h2>
            <p id="loginDesc">请输入密码进入后台</p>
            <div class="sub" id="loginSub">首次使用请设置密码</div>
            <div class="error" id="loginError">密码错误，请重试</div>
            <input type="password" id="passwordInput" placeholder="请输入密码" />
            <input type="password" id="confirmInput" placeholder="请再次输入密码" style="display:none;" />
            <button class="btn-login" id="loginBtn" onclick="handleLogin()">登录</button>
            <div class="hint" id="loginHint">提示：首次访问请设置密码，之后用该密码登录</div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainContent" style="display:none;">
        <div class="container">
            <div class="header">
                <h1>📦 订单管理 <small id="orderCount">0 个订单</small></h1>
                <div class="header-actions">
                    <button class="btn btn-outline" onclick="loadOrders()">🔄 刷新</button>
                    <button class="btn btn-outline" onclick="logout()">🚪 退出</button>
                    <a href="/" class="btn btn-primary">📤 上传页面</a>
                </div>
            </div>

            <!-- 搜索栏 -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 搜索微信号 / 订单编号 / 备注..." />
                <button class="btn btn-info" onclick="searchOrders()">搜索</button>
                <button class="btn btn-outline" onclick="clearSearch()">清空</button>
            </div>

            <!-- 统计 -->
            <div class="stats" id="stats">
                <div class="stat-card"><div class="num" id="totalOrders">0</div><div class="label">📋 总订单</div></div>
                <div class="stat-card"><div class="num" id="totalFiles">0</div><div class="label">📄 总文件</div></div>
                <div class="stat-card"><div class="num" id="totalSize">0</div><div class="label">📦 总大小</div></div>
                <div class="stat-card"><div class="num" id="pendingOrders">0</div><div class="label">⏳ 待处理</div></div>
            </div>

            <div id="orderList">
                <div class="loading"><div class="spinner"></div><p style="margin-top:12px;">加载中...</p></div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let toastTimer = null;
    let isSettingPassword = false;

    function showToast(msg, type, duration) {
        type = type || 'info';
        duration = duration || 2500;
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast ' + type;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), duration);
        requestAnimationFrame(() => el.classList.add('show'));
    }

    function formatSize(bytes) {
        if (!bytes) return '0';
        if (bytes < 1024) return bytes + 'B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
        if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
        return (bytes / (1024 * 1024 * 1024)).toFixed(2) + 'GB';
    }

    function getFileIcon(name) {
        const ext = name.split('.').pop().toLowerCase();
        const map = {
            'doc': '📄', 'docx': '📄',
            'ppt': '📽️', 'pptx': '📽️',
            'xls': '📊', 'xlsx': '📊',
            'pdf': '📕',
            'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
            'txt': '📝', 'md': '📝'
        };
        return map[ext] || '📎';
    }

    function getStatusBadge(status) {
        const map = {
            '待处理': '<span class="status-badge pending">⏳ 待处理</span>',
            '处理中': '<span class="status-badge processing">🔄 处理中</span>',
            '已完成': '<span class="status-badge completed">✅ 已完成</span>',
            '已取消': '<span class="status-badge cancelled">❌ 已取消</span>'
        };
        return map[status] || status;
    }

    function getBorderClass(status) {
        const map = {
            '待处理': 'pending',
            '处理中': 'processing',
            '已完成': 'completed',
            '已取消': 'cancelled'
        };
        return map[status] || '';
    }

    function handleLogin() {
        const pwd = document.getElementById('passwordInput').value;
        const confirmPwd = document.getElementById('confirmInput').value;
        const errorEl = document.getElementById('loginError');

        if (isSettingPassword) {
            if (pwd.length < 4) {
                errorEl.textContent = '密码至少4位';
                errorEl.style.display = 'block';
                return;
            }
            if (pwd !== confirmPwd) {
                errorEl.textContent = '两次密码不一致';
                errorEl.style.display = 'block';
                return;
            }
            errorEl.style.display = 'none';

            fetch('/admin/setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('✅ 密码设置成功！', 'success', 1500);
                    isSettingPassword = false;
                    document.getElementById('loginTitle').textContent = '🔐 管理后台';
                    document.getElementById('loginDesc').textContent = '请输入密码进入后台';
                    document.getElementById('loginSub').textContent = '';
                    document.getElementById('loginHint').textContent = '输入密码登录';
                    document.getElementById('confirmInput').style.display = 'none';
                    document.getElementById('loginBtn').textContent = '登录';
                    document.getElementById('passwordInput').value = '';
                    document.getElementById('passwordInput').placeholder = '请输入密码';
                    handleLogin();
                } else {
                    errorEl.textContent = data.message || '设置失败';
                    errorEl.style.display = 'block';
                }
            })
            .catch(() => {
                errorEl.textContent = '网络错误';
                errorEl.style.display = 'block';
            });
            return;
        }

        errorEl.style.display = 'none';

        fetch('/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pwd })
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadOrders();
                loadStats();
            } else {
                errorEl.textContent = data.message || '密码错误';
                errorEl.style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        })
        .catch(() => {
            errorEl.textContent = '网络错误';
            errorEl.style.display = 'block';
        });
    }

    function logout() {
        fetch('/admin/logout', { method: 'POST' })
        .then(() => {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').style.display = 'none';
        });
    }

    function loadStats() {
        fetch('/admin/orders/stats')
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                const s = data.data;
                document.getElementById('totalOrders').textContent = s.total_orders || 0;
                document.getElementById('totalFiles').textContent = s.total_files || 0;
                document.getElementById('totalSize').textContent = formatSize(s.total_size || 0);
                document.getElementById('pendingOrders').textContent = s.pending_orders || 0;
            }
        })
        .catch(err => console.error('加载统计失败:', err));
    }

    function loadOrders() {
        const listEl = document.getElementById('orderList');
        listEl.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px;">加载中...</p></div>';

        fetch('/admin/orders')
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                renderOrders(data.data);
                loadStats();
            } else {
                listEl.innerHTML = `<div class="empty"><span class="icon">⚠️</span><p>${data.message}</p></div>`;
            }
        })
        .catch(err => {
            listEl.innerHTML = `<div class="empty"><span class="icon">⚠️</span><p>加载失败: ${err.message}</p></div>`;
        });
    }

    function searchOrders() {
        const keyword = document.getElementById('searchInput').value.trim();
        if (!keyword) {
            loadOrders();
            return;
        }
        const listEl = document.getElementById('orderList');
        listEl.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px;">搜索中...</p></div>';

        fetch('/admin/orders/search?keyword=' + encodeURIComponent(keyword))
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                renderOrders(data.data);
            } else {
                listEl.innerHTML = `<div class="empty"><span class="icon">⚠️</span><p>${data.message}</p></div>`;
            }
        })
        .catch(err => {
            listEl.innerHTML = `<div class="empty"><span class="icon">⚠️</span><p>搜索失败: ${err.message}</p></div>`;
        });
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        loadOrders();
    }

    function renderOrders(orders) {
        const listEl = document.getElementById('orderList');
        const countEl = document.getElementById('orderCount');

        if (!orders || orders.length === 0) {
            listEl.innerHTML = `<div class="empty"><span class="icon">📭</span><p>暂无订单</p></div>`;
            countEl.textContent = '0 个订单';
            document.getElementById('totalOrders').textContent = '0';
            document.getElementById('totalFiles').textContent = '0';
            document.getElementById('totalSize').textContent = '0';
            document.getElementById('pendingOrders').textContent = '0';
            return;
        }

        countEl.textContent = orders.length + ' 个订单';
        document.getElementById('totalOrders').textContent = orders.length;

        let totalFiles = 0;
        let totalSize = 0;
        let pendingCount = 0;

        let html = '<div class="order-grid">';
        orders.forEach(order => {
            const fileCount = order.files ? order.files.length : 0;
            totalFiles += fileCount;
            if (order.total_size) totalSize += order.total_size;
            if (order.status === '待处理') pendingCount++;

            const status = order.status || '待处理';
            const borderClass = getBorderClass(status);

            let filesHtml = '';
            if (order.files && order.files.length > 0) {
                order.files.forEach(f => {
                    const icon = getFileIcon(f);
                    const downloadUrl = `/admin/download/${encodeURIComponent(order.wechat)}/${encodeURIComponent(f)}`;
                    filesHtml += `<span class="file-tag">${icon} <a href="${downloadUrl}" target="_blank">${f}</a></span>`;
                });
            }

            let remarkHtml = '';
            if (order.remark && order.remark.trim()) {
                remarkHtml = `<div class="remark-content">${order.remark}</div>`;
            }

            html += `
                <div class="order-card">
                    <div class="border-status ${borderClass}"></div>
                    <div class="info">
                        <div class="order-id">
                            #${order.order_id || 'N/A'}
                            <span class="tag">${getStatusBadge(status)}</span>
                        </div>
                        <div class="wechat"><span class="icon">💬</span> ${order.wechat}</div>
                        <div class="meta">
                            <span>📄 ${fileCount} 个文件</span>
                            <span>📦 ${formatSize(order.total_size || 0)}</span>
                            <span>🕐 ${order.created_at || '未知时间'}</span>
                        </div>
                        <div class="files-list">${filesHtml}</div>
                        ${remarkHtml}
                    </div>
                    <div class="actions">
                        ${status !== '已完成' ? `<button class="btn btn-success btn-sm" onclick="markComplete('${order.order_id}')">✅ 完成</button>` : ''}
                        <button class="btn btn-warning btn-sm" onclick="markProcessing('${order.order_id}')">🔄 处理中</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteOrder('${order.wechat}')">🗑 删除</button>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        listEl.innerHTML = html;

        document.getElementById('totalFiles').textContent = totalFiles;
        document.getElementById('totalSize').textContent = formatSize(totalSize);
        document.getElementById('pendingOrders').textContent = pendingCount;
    }

    function markComplete(orderId) {
        if (!confirm(`确定将订单「${orderId}」标记为已完成吗？`)) return;
        updateStatus(orderId, '已完成');
    }

    function markProcessing(orderId) {
        if (!confirm(`确定将订单「${orderId}」标记为处理中吗？`)) return;
        updateStatus(orderId, '处理中');
    }

    function updateStatus(orderId, status) {
        fetch('/admin/orders/' + orderId + '/status', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: status })
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                showToast('✅ ' + data.message, 'success', 2000);
                loadOrders();
            } else {
                showToast('❌ ' + data.message, 'error', 2500);
            }
        })
        .catch(err => {
            showToast('❌ 操作失败: ' + err.message, 'error', 2500);
        });
    }

    function deleteOrder(wechat) {
        if (!confirm(`确定要删除「${wechat}」的所有订单吗？`)) return;

        fetch('/admin/delete/' + encodeURIComponent(wechat), { method: 'DELETE' })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                showToast('✅ 已删除', 'success', 2000);
                loadOrders();
            } else {
                showToast('❌ ' + data.message, 'error', 2500);
            }
        })
        .catch(err => {
            showToast('❌ 删除失败: ' + err.message, 'error', 2500);
        });
    }

    // Enter键登录
    document.getElementById('passwordInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('confirmInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') searchOrders();
    });

    // 检查登录状态
    fetch('/admin/status')
    .then(res => res.json())
    .then(data => {
        if (data.logged_in) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            loadOrders();
            loadStats();
            return;
        }

        if (!data.has_password) {
            isSettingPassword = true;
            document.getElementById('loginTitle').textContent = '🔐 首次设置密码';
            document.getElementById('loginDesc').textContent = '请设置管理员密码';
            document.getElementById('loginSub').textContent = '密码至少4位';
            document.getElementById('loginHint').textContent = '设置后请牢记此密码';
            document.getElementById('confirmInput').style.display = 'block';
            document.getElementById('loginBtn').textContent = '设置密码';
            document.getElementById('passwordInput').placeholder = '请输入密码';
            document.getElementById('passwordInput').value = '';
            document.getElementById('confirmInput').value = '';
        } else {
            isSettingPassword = false;
            document.getElementById('loginTitle').textContent = '🔐 管理后台';
            document.getElementById('loginDesc').textContent = '请输入密码进入后台';
            document.getElementById('loginSub').textContent = '';
            document.getElementById('loginHint').textContent = '输入密码登录';
            document.getElementById('confirmInput').style.display = 'none';
            document.getElementById('loginBtn').textContent = '登录';
            document.getElementById('passwordInput').placeholder = '请输入密码';
            document.getElementById('passwordInput').value = '';
        }
    });

    // 每60秒自动刷新
    setInterval(() => {
        if (document.getElementById('mainContent').style.display !== 'none') {
            loadOrders();
        }
    }, 60000);
</script>
</body>
</html>
